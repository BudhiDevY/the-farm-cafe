<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Staff &amp; Owner Portal | The Farm Cafe</title>
    <link rel="icon" type="image/svg+xml" href="./image/the_food_cafe_logo.svg" />
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        bg: '#FAF8F5',
                        forest: '#2D4A3E',
                        terracotta: '#8B5A2B',
                        charcoal: '#1F2937'
                    },
                    fontFamily: {
                        serif: ['Georgia', 'Cambria', 'Times New Roman', 'Times', 'Serif'],
                        sans: ['ui-sans-serif', 'system-ui', 'Segoe UI', 'Roboto', 'Helvetica', 'Arial', 'sans-serif']
                    }
                }
            }
        }
    </script>
    <style>
        input, select, textarea {
            color: #111827 !important;
            background-color: #ffffff !important;
            caret-color: #111827 !important;
        }
        body { background-color: #FAF8F5; }
    </style>
</head>
<body class="bg-bg text-charcoal antialiased font-sans min-h-screen flex flex-col">

    <!-- OPTIONAL PIN LOCK SCREEN (Change '2026' to your own PIN) -->
    <div id="pin-gate" class="fixed inset-0 z-50 bg-forest flex items-center justify-center p-4">
        <form onsubmit="unlockAdmin(event)" class="bg-bg text-charcoal w-full max-w-xs rounded-2xl shadow-2xl p-6 text-center space-y-4">
            <h1 class="font-serif text-2xl text-forest">Staff &amp; Owner</h1>
            <p class="text-xs text-stone-500">The Farm Cafe • Imphal</p>
            <input id="admin-pin-input" type="password" inputmode="numeric" required placeholder="Enter Staff PIN" class="w-full border border-stone-300 rounded-lg px-3 py-2.5 text-center text-sm tracking-widest">
            <p id="pin-error" class="hidden text-xs text-red-700 font-medium">Incorrect PIN</p>
            <button type="submit" class="w-full bg-forest text-white py-2.5 rounded-lg text-xs font-bold uppercase tracking-wider hover:bg-emerald-900">
                Unlock Portal
            </button>
            <a href="index.html" class="block text-xs text-stone-500 hover:underline pt-1">Back to Customer Menu</a>
        </form>
    </div>

    <!-- TOP HEADER -->
    <header class="bg-forest text-white px-4 sm:px-6 py-4 shadow">
        <div class="max-w-5xl mx-auto flex flex-wrap justify-between items-center gap-3">
            <div>
                <h1 class="font-serif text-xl sm:text-2xl">The Farm Cafe — Admin</h1>
                <p id="order-stats-label" class="text-xs text-amber-200 font-mono mt-0.5"></p>
            </div>
            <div class="flex flex-wrap items-center gap-2">
                <button type="button" id="btn-counter" onclick="renderStaffView('counter')" class="px-4 py-1.5 rounded-full text-xs font-bold uppercase tracking-wider bg-white text-forest">
                    Counter
                </button>
                <button type="button" id="btn-kitchen" onclick="renderStaffView('kitchen')" class="px-4 py-1.5 rounded-full text-xs font-bold uppercase tracking-wider bg-white/15 text-white hover:bg-white/25">
                    Chef / Kitchen
                </button>
                <button type="button" id="btn-menu-admin" onclick="renderStaffView('menu-admin')" class="px-4 py-1.5 rounded-full text-xs font-bold uppercase tracking-wider bg-white/15 text-white hover:bg-white/25">
                    Menu Manager
                </button>
                <button type="button" id="btn-bookings" onclick="renderStaffView('bookings')" class="px-4 py-1.5 rounded-full text-xs font-bold uppercase tracking-wider bg-white/15 text-white hover:bg-white/25">
                    Bookings
                </button>
                <a href="index.html" class="px-3 py-1.5 rounded-full text-xs border border-white/30 text-white/90 hover:bg-white hover:text-forest">
                    Customer View
                </a>
                <button type="button" onclick="toggleChangePinBox()" class="px-3 py-1.5 rounded-full text-xs border border-white/30 text-white/90 hover:bg-white hover:text-forest">
                    Change PIN
                </button>
                <button type="button" onclick="lockAdmin()" class="px-3 py-1.5 rounded-full text-xs border border-white/30 text-white/90 hover:bg-white hover:text-forest">
                    Lock
                </button>
            </div>
        </div>
    </header>

    <!-- KITCHEN ROUTING BAR -->
    <div class="bg-stone-100 border-b border-stone-200 px-4 sm:px-6 py-3">
        <div class="max-w-5xl mx-auto flex flex-wrap justify-between items-center gap-2 text-xs">
            <label class="flex items-center gap-2 font-medium text-charcoal cursor-pointer">
                <input type="checkbox" id="toggle-kitchen-routing" checked onchange="toggleKitchenRouting(this.checked)" class="w-4 h-4 accent-forest">
                <span>Forward orders from Counter to Chef/Kitchen</span>
            </label>
            <button type="button" onclick="refreshAll()" class="text-forest font-bold hover:underline">Refresh</button>
        </div>
    </div>

    <div id="change-pin-box" class="hidden bg-white border border-stone-200 rounded-xl p-4 shadow-sm max-w-md space-y-3 mx-auto mt-4">
        <h3 class="font-serif text-base font-bold text-forest">Change Staff PIN</h3>
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
            <input id="current-pin-input" type="password" inputmode="numeric" placeholder="Current PIN" class="border border-stone-300 rounded px-3 py-2 text-sm">
            <input id="new-pin-input" type="password" inputmode="numeric" placeholder="New PIN (4+ digits)" class="border border-stone-300 rounded px-3 py-2 text-sm">
        </div>
        <p id="change-pin-status" class="hidden text-xs font-medium"></p>
        <div class="flex gap-2">
            <button type="button" onclick="saveNewPin()" class="bg-forest text-white px-4 py-2 rounded text-xs font-bold uppercase hover:bg-emerald-900">
                Save PIN
            </button>
            <button type="button" onclick="toggleChangePinBox()" class="border border-stone-300 px-3 py-2 rounded text-xs font-bold uppercase">
                Cancel
            </button>
        </div>
    </div>

    <!-- MAIN CONTENT -->
    <main class="max-w-5xl w-full mx-auto p-4 sm:p-6 flex-1 space-y-4">
        <!-- IN-PAGE NEW ORDER MESSAGE -->
        <div id="new-order-banner" class="hidden px-4 py-3 rounded-lg bg-emerald-50 border border-emerald-300 text-emerald-950 flex items-center justify-between gap-3 shadow-sm">
            <span id="new-order-message" class="text-sm font-semibold"></span>
            <button type="button" onclick="document.getElementById('new-order-banner').classList.add('hidden')" class="text-xs font-bold uppercase tracking-wider text-emerald-800 hover:underline shrink-0">
                Dismiss
            </button>
        </div>

        <div id="staff-content-area" class="space-y-4"></div>
    </main>

    <!-- ADD DISH MODAL -->
    <div id="add-dish-modal" class="fixed inset-0 z-50 bg-black/70 flex items-center justify-center p-4 hidden">
        <div class="bg-bg text-charcoal w-full max-w-md rounded-xl shadow-2xl border border-stone-300 overflow-hidden">
            <div class="bg-forest text-white px-5 py-4 flex justify-between items-center">
                <div>
                    <h4 class="font-serif text-lg">Add New Menu Item</h4>
                    <p id="next-dish-id-label" class="text-xs text-amber-200 font-mono">Auto-assigned ID: #27</p>
                </div>
                <button type="button" onclick="closeAddDishModal()" class="text-white/80 hover:text-white text-2xl leading-none">&times;</button>
            </div>
            <form id="add-dish-form" onsubmit="handleAddNewDish(event)" class="p-5 space-y-3">
                <div>
                    <label class="block text-xs font-bold uppercase text-charcoal/70 mb-1">Dish Name *</label>
                    <input id="new-dish-title" type="text" required class="w-full border border-stone-300 rounded px-3 py-2 text-sm">
                </div>
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-xs font-bold uppercase text-charcoal/70 mb-1">Category *</label>
                        <select id="new-dish-category" required class="w-full border border-stone-300 rounded px-3 py-2 text-sm">
                            <option value="small-plates">Small plates</option>
                            <option value="continental">Continental</option>
                            <option value="oriental">Oriental</option>
                            <option value="specials">Farm cafe special</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-bold uppercase text-charcoal/70 mb-1">Price (₹) *</label>
                        <input id="new-dish-price" type="number" min="1" required class="w-full border border-stone-300 rounded px-3 py-2 text-sm">
                    </div>
                </div>
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-xs font-bold uppercase text-charcoal/70 mb-1">Dietary Type *</label>
                        <select id="new-dish-veg" class="w-full border border-stone-300 rounded px-3 py-2 text-sm">
                            <option value="true">Veg</option>
                            <option value="false">Non-Veg</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-bold uppercase text-charcoal/70 mb-1">Tag (Optional)</label>
                        <input id="new-dish-tag" type="text" class="w-full border border-stone-300 rounded px-3 py-2 text-sm">
                    </div>
                </div>
                <div>
                    <label class="block text-xs font-bold uppercase text-charcoal/70 mb-1">Description *</label>
                    <textarea id="new-dish-desc" rows="2" required class="w-full border border-stone-300 rounded px-3 py-2 text-sm"></textarea>
                </div>
                <div class="flex justify-end gap-2 pt-2">
                    <button type="button" onclick="closeAddDishModal()" class="px-4 py-2 rounded border border-stone-300 text-xs font-bold uppercase">Cancel</button>
                    <button type="submit" class="px-5 py-2 rounded bg-forest text-white text-xs font-bold uppercase">Add Dish</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://yjptdcfvcainzzxrbbok.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InlqcHRkY2Z2Y2Fpbnp6eHJiYm9rIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTUxNzc5MzAsImV4cCI6MjExMDc1MzkzMH0.aJfq6lxX2miEw520pyBLWEe3HOnPywfUQfn3fSlv2cA';
        const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        const PIN_STORAGE_KEY = 'farm_cafe_admin_pin';
        const SESSION_UNLOCK_KEY = 'farm_cafe_admin_unlocked';
        const DEFAULT_MENU_COUNT = 26;

        let cachedPin = localStorage.getItem(PIN_STORAGE_KEY) || '2026';
        let knownOrderIds = new Set();
        let hasInitializedOrders = false;
        let liveSyncTimer = null;
        let ordersRealtimeChannel = null;

        async function syncPinFromDb() {
            const { data, error } = await sb
                .from('admin_settings')
                .select('pin')
                .eq('id', 'main')
                .maybeSingle();

            if (!error && data?.pin) {
                cachedPin = String(data.pin);
                localStorage.setItem(PIN_STORAGE_KEY, cachedPin);
            }
            return cachedPin;
        }

        const state = {
            enableKitchen: true,
            currentTab: 'counter',
            orders: [],
            bookings: [],
            customMenu: []
        };

        function normalizeOrderRow(o) {
            return {
                ...o,
                status: o.status || 'NEW',
                total: Number(o.total ?? 0),
                items: Array.isArray(o.items) ? o.items : [],
                customer: o.customer || {
                    name: o.customer_name || 'Guest',
                    phone: o.customer_phone || '',
                    zone: o.zone || ''
                }
            };
        }

        function showNewOrderMessage(order) {
            const banner = document.getElementById('new-order-banner');
            const msg = document.getElementById('new-order-message');
            if (!banner || !msg) return;

            const code = String(order.id ?? '').slice(-4) || 'NEW';
            const customerName = order.customer_name || order.customer?.name || 'Customer';
            const zoneOrService = order.zone || order.customer?.zone || order.service || 'Order';
            const total = Number(order.total || 0).toLocaleString('en-IN');

            msg.textContent = `New order #${code} from ${customerName} (${zoneOrService}) — ₹${total}`;
            banner.classList.remove('hidden');
        }

        function detectAndNotifyNewOrders(rows) {
            if (!Array.isArray(rows)) return;

            if (!hasInitializedOrders) {
                rows.forEach(r => knownOrderIds.add(Number(r.id)));
                hasInitializedOrders = true;
                return;
            }

            const incoming = rows.filter(r => !knownOrderIds.has(Number(r.id)));
            rows.forEach(r => knownOrderIds.add(Number(r.id)));

            if (incoming.length > 0 && document.getElementById('pin-gate').classList.contains('hidden')) {
                showNewOrderMessage(incoming[incoming.length - 1]);
            }
        }

        async function loadBackendData() {
            const [ordersRes, bookingsRes, menuRes] = await Promise.all([
                sb.from('orders').select('*'),
                sb.from('bookings').select('*'),
                sb.from('custom_menu_items').select('*')
            ]);

            if (!ordersRes.error && ordersRes.data) {
                const sorted = [...ordersRes.data].sort((a, b) => Number(a.id) - Number(b.id));
                detectAndNotifyNewOrders(sorted);

                state.orders = sorted.map(normalizeOrderRow);
                localStorage.setItem('farm_cafe_orders', JSON.stringify(state.orders));

                state.orders
                    .filter(o => o.status === 'READY')
                    .forEach(o => scheduleReadyOrderDeletion(o.id));
            }

            if (!bookingsRes.error && bookingsRes.data) {
                state.bookings = bookingsRes.data;
                localStorage.setItem('farm_cafe_bookings', JSON.stringify(bookingsRes.data));
            }

            if (!menuRes.error && menuRes.data) {
                state.customMenu = menuRes.data.map(item => ({
                    ...item,
                    desc: item.description ?? item.desc ?? '',
                    isCustom: true
                }));
                localStorage.setItem('farm_cafe_custom_menu', JSON.stringify(state.customMenu));
            }

            if (typeof renderStaffView === 'function') {
                renderStaffView(state.currentTab || 'counter');
            }
        }

        function startLiveUpdates() {
            if (!liveSyncTimer) {
                liveSyncTimer = setInterval(() => {
                    const isLocked = !document.getElementById('pin-gate').classList.contains('hidden');
                    if (!isLocked) {
                        loadBackendData();
                    }
                }, 3000);
            }

            if (!ordersRealtimeChannel && typeof sb.channel === 'function') {
                ordersRealtimeChannel = sb
                    .channel('farm-cafe-orders-live')
                    .on(
                        'postgres_changes',
                        { event: '*', schema: 'public', table: 'orders' },
                        (payload) => {
                            if (payload.eventType === 'INSERT' && payload.new) {
                                const row = payload.new;
                                const numId = Number(row.id);
                                if (!knownOrderIds.has(numId)) {
                                    knownOrderIds.add(numId);
                                    if (document.getElementById('pin-gate').classList.contains('hidden')) {
                                        showNewOrderMessage(row);
                                    }
                                }
                            }
                            if (document.getElementById('pin-gate').classList.contains('hidden')) {
                                loadBackendData();
                            }
                        }
                    )
                    .subscribe();
            }
        }

        function openDashboardSession() {
            sessionStorage.setItem(SESSION_UNLOCK_KEY, 'true');
            document.getElementById('pin-gate').classList.add('hidden');
            document.getElementById('pin-error').classList.add('hidden');
            loadBackendData();
            startLiveUpdates();
        }

        function lockAdmin() {
            sessionStorage.removeItem(SESSION_UNLOCK_KEY);
            document.getElementById('admin-pin-input').value = '';
            document.getElementById('pin-gate').classList.remove('hidden');
        }

        document.addEventListener('DOMContentLoaded', async () => {
            await syncPinFromDb();
            if (sessionStorage.getItem(SESSION_UNLOCK_KEY) === 'true') {
                openDashboardSession();
            }
        });

        function toggleChangePinBox() {
            const box = document.getElementById('change-pin-box');
            const status = document.getElementById('change-pin-status');
            status.classList.add('hidden');
            document.getElementById('current-pin-input').value = '';
            document.getElementById('new-pin-input').value = '';
            box.classList.toggle('hidden');
        }

        async function saveNewPin() {
            const currentPin = document.getElementById('current-pin-input').value.trim();
            const newPin = document.getElementById('new-pin-input').value.trim();
            const status = document.getElementById('change-pin-status');

            status.classList.remove('hidden', 'text-red-700', 'text-emerald-700');

            const activePin = await syncPinFromDb();
            if (currentPin !== activePin) {
                status.textContent = 'Current PIN is incorrect.';
                status.classList.add('text-red-700');
                return;
            }

            if (newPin.length < 4) {
                status.textContent = 'Enter at least 4 characters or digits for the new PIN.';
                status.classList.add('text-red-700');
                return;
            }

            const { error } = await sb
                .from('admin_settings')
                .upsert([{ id: 'main', pin: newPin, updated_at: new Date().toISOString() }]);

            if (error) {
                status.textContent = 'Failed to save PIN.';
                status.classList.add('text-red-700');
                return;
            }

            cachedPin = newPin;
            localStorage.setItem(PIN_STORAGE_KEY, newPin);
            status.textContent = 'PIN updated for normal & Incognito mode.';
            status.classList.add('text-emerald-700');
            document.getElementById('current-pin-input').value = '';
            document.getElementById('new-pin-input').value = '';
        }

        async function unlockAdmin(e) {
            e.preventDefault();
            const val = document.getElementById('admin-pin-input').value.trim();
            const currentPin = await syncPinFromDb();

            if (val === currentPin) {
                openDashboardSession();
            } else {
                document.getElementById('pin-error').classList.remove('hidden');
            }
        }

        async function deleteBooking(id) {
            const { error } = await sb
                .from('bookings')
                .delete()
                .eq('id', id);

            if (error) {
                console.error('Supabase delete booking error:', error);
                alert('Could not delete booking right now. Please try again.');
                return;
            }

            state.bookings = state.bookings.filter(b => Number(b.id) !== Number(id));
            localStorage.setItem('farm_cafe_bookings', JSON.stringify(state.bookings));
            renderStaffView('bookings');
        }

        async function deleteOrder(id) {
            const { error } = await sb
                .from('orders')
                .delete()
                .eq('id', id);

            if (error) {
                console.error('Supabase delete order error:', error);
                alert('Could not delete order right now. Please try again.');
                return;
            }

            state.orders = state.orders.filter(o => Number(o.id) !== Number(id));
            localStorage.setItem('farm_cafe_orders', JSON.stringify(state.orders));
            renderStaffView(state.currentTab);
        }

        function refreshAll() {
            if (!document.getElementById('pin-gate').classList.contains('hidden')) return;
            loadBackendData();
        }

        function getNextDishId() {
            const ids = state.customMenu.map(i => Number(i.id) || 0);
            return Math.max(DEFAULT_MENU_COUNT, ...ids) + 1;
        }

        function openAddDishModal() {
            document.getElementById('next-dish-id-label').textContent = `Auto-assigned ID: #${getNextDishId()}`;
            document.getElementById('add-dish-form').reset();
            document.getElementById('add-dish-modal').classList.remove('hidden');
        }

        function closeAddDishModal() {
            document.getElementById('add-dish-modal').classList.add('hidden');
        }

        async function handleAddNewDish(e) {
            e.preventDefault();

            const payload = {
                id: getNextDishId(),
                title: document.getElementById('new-dish-title').value.trim(),
                category: document.getElementById('new-dish-category').value,
                price: Number(document.getElementById('new-dish-price').value),
                veg: document.getElementById('new-dish-veg').value === 'true',
                tag: document.getElementById('new-dish-tag').value.trim(),
                description: document.getElementById('new-dish-desc').value.replace(/\s+/g, ' ').trim()
            };

            const { data, error } = await sb
                .from('custom_menu_items')
                .insert([payload])
                .select()
                .single();

            if (error) {
                console.error('Supabase add dish error:', error);
                alert('Could not save new dish: ' + error.message);
                return;
            }

            const savedItem = {
                ...(data || payload),
                desc: (data && data.description) || payload.description,
                isCustom: true
            };

            state.customMenu.push(savedItem);
            localStorage.setItem('farm_cafe_custom_menu', JSON.stringify(state.customMenu));
            closeAddDishModal();
            renderStaffView('menu-admin');
        }

        async function deleteCustomDish(id) {
            const { error } = await sb
                .from('custom_menu_items')
                .delete()
                .eq('id', id);

            if (error) {
                console.error('Supabase delete dish error:', error);
                alert('Could not delete dish right now. Please try again.');
                return;
            }

            const savedCustom = JSON.parse(localStorage.getItem('farm_cafe_custom_menu') || '[]');
            const updated = savedCustom.filter(item => Number(item.id) !== Number(id));
            localStorage.setItem('farm_cafe_custom_menu', JSON.stringify(updated));

            state.customMenu = updated;
            renderStaffView('menu-admin');
        }

        function toggleKitchenRouting(enabled) {
            state.enableKitchen = enabled;
            renderStaffView(state.currentTab);
        }

        async function moveOrderToChef(id) {
            const { error } = await sb
                .from('orders')
                .update({ status: 'SENT_TO_CHEF' })
                .eq('id', id);

            if (error) {
                console.error('Supabase move order error:', error);
                alert('Could not update order status.');
                return;
            }

            const order = state.orders.find(o => Number(o.id) === Number(id));
            if (order) {
                order.status = 'SENT_TO_CHEF';
                localStorage.setItem('farm_cafe_orders', JSON.stringify(state.orders));
            }
            renderStaffView('counter');
        }

        const READY_DELETE_DELAY_MS = 2 * 60 * 1000;
        const readyDeleteTimers = new Map();

        function scheduleReadyOrderDeletion(id) {
            const numericId = Number(id);
            if (readyDeleteTimers.has(numericId)) {
                return;
            }

            const timer = setTimeout(async () => {
                readyDeleteTimers.delete(numericId);

                const { error } = await sb
                    .from('orders')
                    .delete()
                    .eq('id', id);

                if (error) {
                    console.error('Auto-delete ready order error:', error);
                    return;
                }

                state.orders = state.orders.filter(o => Number(o.id) !== numericId);
                localStorage.setItem('farm_cafe_orders', JSON.stringify(state.orders));
                renderStaffView(state.currentTab);
            }, READY_DELETE_DELAY_MS);

            readyDeleteTimers.set(numericId, timer);
        }

        async function markOrderReady(id) {
            const { error } = await sb
                .from('orders')
                .update({ status: 'READY' })
                .eq('id', id);

            if (error) {
                console.error('Supabase mark ready error:', error);
                alert('Could not mark order as ready.');
                return;
            }

            const order = state.orders.find(o => Number(o.id) === Number(id));
            if (order) {
                order.status = 'READY';
                localStorage.setItem('farm_cafe_orders', JSON.stringify(state.orders));
            }

            scheduleReadyOrderDeletion(id);
            renderStaffView(state.currentTab);
        }

        function renderStaffView(viewType) {
            state.currentTab = viewType;
            const container = document.getElementById('staff-content-area');
            const statsLabel = document.getElementById('order-stats-label');

            const newCount = state.orders.filter(o => o.status === 'NEW').length;
            const chefCount = state.orders.filter(o => o.status === 'SENT_TO_CHEF').length;
            const readyCount = state.orders.filter(o => o.status === 'READY').length;
            statsLabel.textContent = `Counter: ${newCount} | Kitchen: ${chefCount} | Ready: ${readyCount}`;

            ['counter', 'kitchen', 'menu-admin', 'bookings'].forEach(tab => {
                const btn = document.getElementById(`btn-${tab}`);
                if (!btn) return;
                btn.className = tab === viewType
                    ? 'px-4 py-1.5 rounded-full text-xs font-bold uppercase tracking-wider bg-white text-forest'
                    : 'px-4 py-1.5 rounded-full text-xs font-bold uppercase tracking-wider bg-white/15 text-white hover:bg-white/25';
            });

            if (viewType === 'counter') {
                const readyOrders = state.orders.filter(o => o.status === 'READY').reverse();
                const counterOrders = state.orders.filter(o => o.status === 'NEW').reverse();

                const readyBannerHtml = readyOrders.length === 0 ? '' : `
                    <div class="bg-emerald-50 border border-emerald-300 rounded-lg p-4 space-y-2">
                        <div class="text-xs font-bold uppercase tracking-wider text-emerald-800">
                            Ready to Serve (${readyOrders.length}) — Auto-clears shortly
                        </div>
                        ${readyOrders.map(o => `
                            <div class="bg-white border border-emerald-200 p-3 rounded flex flex-wrap justify-between items-center gap-2">
                                <div>
                                    <span class="font-bold text-sm">#${o.id.toString().slice(-4)} • ${o.customer.name}</span>
                                    <span class="text-xs text-stone-600 ml-2">(${o.customer.zone || o.service})</span>
                                </div>
                                <button type="button" onclick="deleteOrder(${o.id})" class="bg-emerald-700 text-white px-3 py-1.5 rounded text-xs font-bold uppercase">
                                    Served &amp; Clear
                                </button>
                            </div>
                        `).join('')}
                    </div>
                `;

                const newOrdersHtml = counterOrders.length === 0
                    ? `<p class="text-stone-500 italic text-center py-8">No new orders waiting at the counter.</p>`
                    : counterOrders.map(o => `
                        <div class="bg-white border-l-4 border-forest p-4 rounded-lg shadow-sm flex flex-col sm:flex-row justify-between sm:items-center gap-4">
                            <div>
                                <div class="text-xs font-bold uppercase text-stone-500 mb-1">${o.service} • #${o.id.toString().slice(-4)}</div>
                                <h4 class="font-bold text-base">${o.customer.name} (${o.customer.zone})</h4>
                                <p class="text-xs text-stone-500 mb-2">${o.customer.phone}</p>
                                <div class="text-xs text-stone-700 space-y-0.5 mb-2">
                                    ${o.items.map(i => `<div>${i.qty}x ${i.title} — ₹${i.price * i.qty}</div>`).join('')}
                                </div>
                                <div class="font-serif font-bold text-forest text-lg">Total: ₹${o.total}</div>
                            </div>
                            <div class="flex items-center gap-2">
                                ${state.enableKitchen
                                    ? `<button type="button" onclick="moveOrderToChef(${o.id})" class="bg-forest text-white px-4 py-2 rounded text-xs font-bold uppercase">Send to Chef</button>`
                                    : `<button type="button" onclick="markOrderReady(${o.id})" class="bg-emerald-700 text-white px-4 py-2 rounded text-xs font-bold uppercase">Complete Order</button>`
                                }
                            </div>
                        </div>
                    `).join('');

                container.innerHTML = readyBannerHtml + newOrdersHtml;
            } else if (viewType === 'kitchen') {
                const chefOrders = state.orders.filter(o => o.status === 'SENT_TO_CHEF').reverse();
                container.innerHTML = chefOrders.length === 0
                    ? `<p class="text-stone-500 italic text-center py-8">Kitchen clear. No active tickets.</p>`
                    : chefOrders.map(o => `
                        <div class="bg-white border-l-4 border-terracotta p-4 rounded-lg shadow-sm flex flex-col sm:flex-row justify-between sm:items-center gap-4">
                            <div>
                                <div class="text-xs font-bold uppercase text-terracotta mb-1">Ticket #${o.id.toString().slice(-4)} • ${o.service} • ${o.customer.zone}</div>
                                <ul class="text-sm font-medium space-y-1">
                                    ${o.items.map(i => `<li>• <strong>${i.qty}x</strong> ${i.title}</li>`).join('')}
                                </ul>
                            </div>
                            <div class="flex items-center gap-2">
                                <button type="button" onclick="markOrderReady(${o.id})" class="bg-emerald-700 text-white px-5 py-2.5 rounded text-xs font-bold uppercase">Mark Ready</button>
                            </div>
                        </div>
                    `).join('');
            } else if (viewType === 'menu-admin') {
                container.innerHTML = `
                    <div class="flex flex-wrap justify-between items-center gap-3 bg-white p-4 rounded-lg border border-stone-200">
                        <div>
                            <h4 class="font-serif text-lg text-forest font-bold">Custom Dishes (${state.customMenu.length} added)</h4>
                            <p class="text-xs text-stone-500">Default 26 items stay on customer menu; next custom ID is <strong>#${getNextDishId()}</strong></p>
                        </div>
                        <button type="button" onclick="openAddDishModal()" class="bg-forest text-white px-4 py-2.5 rounded-lg text-xs font-bold uppercase">+ Add New Item</button>
                    </div>
                    <div class="space-y-2">
                        ${state.customMenu.length === 0
                            ? `<p class="text-stone-500 italic text-center py-6">No custom dishes added yet.</p>`
                            : state.customMenu.map(item => `
                                <div class="bg-white p-3.5 rounded-lg border border-stone-200 flex justify-between items-center gap-4">
                                    <div>
                                        <span class="font-mono text-xs bg-stone-200 px-2 py-0.5 rounded font-bold">#${item.id}</span>
                                        <strong class="text-sm ml-2">${item.title}</strong>
                                        <span class="text-xs text-stone-500 ml-2">(${item.category})</span>
                                        <p class="text-xs text-stone-500 mt-1">${item.desc}</p>
                                    </div>
                                    <div class="flex items-center gap-3 shrink-0">
                                        <span class="font-bold text-forest text-sm">₹${item.price}</span>
                                        <button type="button" onclick="deleteCustomDish(${item.id})" class="text-xs text-red-600 hover:underline font-semibold">Delete</button>
                                    </div>
                                </div>
                            `).join('')
                        }
                    </div>
                `;
            } else if (viewType === 'bookings') {
                const list = [...state.bookings].reverse();
                container.innerHTML = list.length === 0
                    ? `<p class="text-stone-500 italic text-center py-8">No table bookings yet.</p>`
                    : list.map(b => `
                        <div class="bg-white p-4 rounded-lg border border-stone-200 flex flex-wrap justify-between items-center gap-2">
                            <div>
                                <div class="font-bold text-sm">${b.name} • ${b.guests} Guests</div>
                                <div class="text-xs text-stone-500">${b.phone}</div>
                            </div>
                            <div class="flex items-center gap-3">
                                <div class="text-xs font-mono bg-stone-100 px-3 py-1.5 rounded">${b.date_time || b.dateTime || 'Not specified'}</div>
                                <button type="button" onclick="deleteBooking(${b.id})" class="text-xs text-red-600 hover:underline font-semibold">
                                    Delete
                                </button>
                            </div>
                        </div>
                    `).join('');
            }
        }
    </script>
</body>
</html>
